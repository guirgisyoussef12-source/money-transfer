{% extends 'base.html' %}

{% block content %}

<style>
    .auth-wrap {
        display: grid;
        min-height: 80vh;
        grid-template-columns: 1fr 420px;
        gap: 40px;
        align-items: center;
    }

    .auth-left h1 {
        font-size: 48px;
        margin-bottom: 20px;
    }

    .auth-left p {
        color: #666;
        line-height: 1.7;
        font-size: 18px;
    }

    .auth-card {
        background: white;
        padding: 35px;
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    }

    .auth-card h2 {
        margin-bottom: 25px;
    }

    .auth-card form p {
        margin-bottom: 18px;
    }

    .auth-card input {
        width: 100%;
        padding: 12px;
        border: 1px solid #ddd;
        border-radius: 10px;
        margin-top: 6px;
    }

    .auth-btn {
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 10px;
        background: black;
        color: white;
        font-size: 16px;
        cursor: pointer;
        margin-top: 10px;
    }

    .auth-btn:hover {
        opacity: 0.9;
    }

    .bottom-text {
        text-align: center;
        margin-top: 20px;
        color: #666;
    }

    .bottom-text a {
        text-decoration: none;
        font-weight: bold;
    }

    @media (max-width: 850px) {
        .auth-wrap {
            grid-template-columns: 1fr;
        }

        .auth-left {
            text-align: center;
        }
    }
</style>

<section class="auth-wrap">

    <div class="auth-left">
        <h1>Welcome Back 👋</h1>

        <p>
            Login to access your banking dashboard,
            transfer money securely,
            track transactions,
            and manage your account easily.
        </p>
    </div>

    <div class="auth-card">

        <h2>Login</h2>

        <form method="POST">

            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit" class="auth-btn">
                Login
            </button>

        </form>

        <p class="bottom-text">
            Don't have an account?
            <a href="{% url 'sign_up' %}">
                Sign Up
            </a>
        </p>

    </div>

</section>

{% endblock %}
