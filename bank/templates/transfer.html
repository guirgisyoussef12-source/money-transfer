{% extends 'base.html' %}

{% block content %}
<div style="max-width:480px; margin:0 auto;">

    <div class="card">
        <h2 class="card-title">⇄ Transfer Money</h2>
        <p style="color:#64748b; margin-bottom:24px; font-size:14px;">
            Available: <strong style="color:#0f172a; font-size:18px;">${{ sender.balance }}</strong>
        </p>

        {% if error %}
        <div class="alert alert-error">{{ error }}</div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <div class="form-group">
                <label for="receiver">Recipient Username</label>
                <input
                    type="text"
                    id="receiver"
                    name="receiver"
                    placeholder="Enter username"
                    required
                    autofocus
                >
            </div>

            <div class="form-group">
                <label for="amount">Amount (USD)</label>
                <input
                    type="number"
                    id="amount"
                    name="amount"
                    step="0.01"
                    min="0.01"
                    placeholder="0.00"
                    required
                >
            </div>

            <button type="submit" class="btn btn-primary btn-lg btn-full">Send Money</button>
        </form>

        <a href="{% url 'dashboard' %}" style="display:block; text-align:center; margin-top:14px; color:#94a3b8; font-size:13px; text-decoration:none;">← Back to Dashboard</a>
    </div>
</div>
{% endblock %}
