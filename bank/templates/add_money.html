{% extends 'base.html' %}

{% block content %}

<h2>Add Money 💰</h2>

<h3>Current Balance: ${{ balance }}</h3>

<form method="POST">
    {% csrf_token %}

    <input
        type="number"
        step="0.01"
        name="amount"
        placeholder="Enter amount"
        required
    >

    <button type="submit">
        Add Money
    </button>
</form>

{% if error %}
<p style="color:red;">
    {{ error }}
</p>
{% endif %}

{% endblock %}
